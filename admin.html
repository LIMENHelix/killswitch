<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Live Local Sites · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="/logo-mark.svg?v=2" />
<style>
  :root{--bg:#121214;--panel:#1a1a1e;--metal:#232328;--line:#34343c;--ink:#fff;--mute:#b6bac2;--mute2:#888c96;--amber:#FFC42E;--red:#FF5546;--go:#1BA45A;--blue:#9db0ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:1240px;margin:0 auto;padding:22px}
  h1{font-family:"Archivo",sans-serif;font-weight:900;font-size:1.4rem}
  .sub{color:var(--mute2);font-size:.82rem;margin-top:3px}
  /* login */
  #login{max-width:360px;margin:14vh auto;text-align:center}
  #login h1{margin-bottom:8px}
  #login input{width:100%;margin:16px 0 10px;background:var(--metal);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font:inherit}
  .btn{font-family:"Archivo",sans-serif;font-weight:700;background:var(--go);color:#fff;border:1px solid var(--go);border-radius:10px;padding:12px 20px;cursor:pointer;font-size:.95rem}
  .btn:hover{filter:brightness(1.09)}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.sm{padding:6px 12px;font-size:.8rem}
  .err{color:var(--red);font-size:.85rem;min-height:18px;margin-top:6px}
  /* app */
  #app{display:none}
  .top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  /* live board */
  .board{background:linear-gradient(180deg,#17171b,#141416);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:18px}
  .board-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .live{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--go)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--go);box-shadow:0 0 0 0 rgba(27,164,90,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(27,164,90,.55)}70%{box-shadow:0 0 0 9px rgba(27,164,90,0)}100%{box-shadow:0 0 0 0 rgba(27,164,90,0)}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  .spend{color:var(--mute2);font-size:.82rem}
  .spend b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:1rem;margin-left:4px}
  .prog-top{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
  .prog-top .pct{font-family:"Archivo",sans-serif;font-weight:900;font-size:2rem;color:var(--go);font-variant-numeric:tabular-nums}
  .prog-top .cap{color:var(--mute);font-size:.85rem}
  .track{height:12px;background:#0c0c0e;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,#158a4c,#1BA45A,#2fce77);border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .prog-sub{margin-top:7px;color:var(--mute2);font-size:.8rem;font-family:"IBM Plex Mono",monospace}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-top:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .tile .k{font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute2);margin-top:3px}
  .tile.go .k{color:var(--go)} .tile.amber .k{color:var(--amber)} .tile.red .k{color:var(--red)} .tile.blue .k{color:var(--blue)} .tile.gold .k{color:#ffd85c}
  /* autopilot panel */
  /* ---- LASER funnel ---- */
  .laser{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
  .laser-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .laser-h h2{font-family:"Archivo",sans-serif;font-weight:900;font-size:1rem}
  .laser-h .note{color:var(--mute2);font-size:.74rem}
  .stages{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-bottom:16px}
  .stg{flex:1;min-width:96px;background:var(--metal);border:1px solid var(--line);padding:11px 12px;position:relative}
  .stg:first-child{border-radius:8px 0 0 8px}
  .stg:last-child{border-radius:0 8px 8px 0}
  .stg+.stg{border-left:none}
  .stg b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
  .stg span{display:block;font-size:.68rem;color:var(--mute2);text-transform:uppercase;letter-spacing:.09em;margin-top:3px}
  .stg.dead b{color:var(--mute2)}
  .stg .conv{position:absolute;top:-9px;right:-1px;font-family:"IBM Plex Mono",monospace;font-size:.58rem;
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:1px 6px;color:var(--mute)}
  .laser-sub{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:14px;font-size:.8rem;color:var(--mute)}
  .laser-sub b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
  .plays{width:100%;border-collapse:collapse;font-size:.8rem}
  .plays th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--mute2);padding:7px 8px;border-bottom:1px solid var(--line);font-weight:600}
  .plays td{padding:8px;border-bottom:1px solid #26262c;color:var(--mute);vertical-align:middle}
  .plays tr:last-child td{border-bottom:none}
  .plays td.k{color:var(--ink)}
  .plays td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wbar{display:flex;align-items:center;gap:7px;min-width:104px}
  .wbar i{flex:1;height:5px;background:#26262c;border-radius:3px;overflow:hidden;display:block}
  .wbar i em{display:block;height:100%;background:var(--go);border-radius:3px}
  .wbar span{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--mute2);width:30px;text-align:right}
  .chan{font-family:"IBM Plex Mono",monospace;font-size:.66rem;background:var(--metal);border:1px solid var(--line);
    border-radius:3px;padding:2px 6px;color:var(--mute)}
  .laser-empty{color:var(--mute2);font-size:.82rem;padding:8px 0}

  .autopanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
  .ap-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .ap-title{font-family:"Archivo",sans-serif;font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:10px}
  .ap-state{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.1em;padding:3px 8px;border-radius:999px}
  .ap-state.on{background:rgba(27,164,90,.16);color:var(--go)} .ap-state.off{background:rgba(150,150,160,.15);color:var(--mute2)}
  .ap-sub{color:var(--mute2);font-size:.82rem;margin:7px 0 13px}
  .ap-grid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  .ap-f{display:flex;flex-direction:column;gap:5px;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mute2)}
  .ap-f input{width:150px}
  .ap-last{color:var(--mute2);font-size:.78rem;font-family:"IBM Plex Mono",monospace;margin-top:11px;min-height:16px}
  .ap-budget{font-size:.78rem;font-family:"IBM Plex Mono",monospace;margin-top:10px;min-height:16px;color:var(--mute2)}
  .ap-budget.warn{color:var(--amber)}
  .switch{position:relative;display:inline-block;width:52px;height:28px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--metal);border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:.2s}
  .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:var(--mute);border-radius:50%;transition:.2s}
  .switch input:checked+.slider{background:rgba(27,164,90,.3);border-color:var(--go)}
  .switch input:checked+.slider:before{transform:translateX(24px);background:var(--go)}
  /* filters + table */
  .bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}
  select,input.f{background:var(--metal);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font:inherit;font-size:.85rem}
  input.f{min-width:200px}
  .toolbar{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar .n{color:var(--mute2);font-size:.85rem}
  .wrapt{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-height:66vh;overflow-y:auto}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.notes-c{white-space:normal;min-width:170px}
  th{color:var(--mute2);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;position:sticky;top:0;background:#0e0e10;z-index:2}
  tr:hover td{background:var(--panel)}
  td.name{font-weight:600;white-space:normal;max-width:210px}
  .attr{display:block;margin-top:3px;color:var(--blue);font-family:"IBM Plex Mono",monospace;
    font-size:.58rem;letter-spacing:.03em;font-weight:500;text-transform:uppercase}
  .pill{font-size:.64rem;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .pill.queued{background:rgba(255,196,46,.14);color:var(--amber)}
  .pill.mailed{background:rgba(27,164,90,.16);color:var(--go)}
  .pill.suppressed{background:rgba(255,85,70,.17);color:var(--red)}
  .pill.bad_address{background:rgba(255,85,70,.16);color:var(--red)}
  .pill.noaddr{background:rgba(150,150,160,.15);color:var(--mute2)}
  a{color:var(--amber)}
  select.stage{background:var(--metal);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font:inherit;font-size:.78rem}
  select.stage.s-responded{border-color:var(--go);color:var(--go)}
  select.stage.s-won{border-color:#ffd85c;color:#ffd85c}
  select.stage.s-called{border-color:var(--blue);color:var(--blue)}
  select.stage.s-dead{opacity:.5}
  input.note{background:var(--metal);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:inherit;font-size:.8rem;padding:4px 8px;width:100%}

  /* manager runbook */
  .runbook{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:0 0 20px}
  .runbook>summary{cursor:pointer;padding:15px 20px;font-family:"Archivo",sans-serif;font-weight:700;font-size:1rem;color:var(--amber);list-style:none}
  .runbook>summary::-webkit-details-marker{display:none}
  .runbook>summary::before{content:"\25B8";display:inline-block;margin-right:10px;transition:transform .2s}
  .runbook[open]>summary::before{transform:rotate(90deg)}
  .runbook[open]>summary{border-bottom:1px solid var(--line)}
  .rb{padding:6px 22px 22px;color:var(--mute);font-size:.92rem;line-height:1.6}
  .rb h3{font-family:"Archivo",sans-serif;color:var(--ink);font-size:.95rem;margin:20px 0 8px}
  .rb b{color:var(--ink)}
  .rb a{color:var(--amber);text-decoration:underline}
  .rb ol{margin:0 0 0 20px}
  .rb ol li{margin-bottom:7px}
  .rbt{width:100%;border-collapse:collapse}
  .rbt td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
  .rbt tr:first-child td{border-top:none}
  .rbt td:first-child{white-space:nowrap;color:var(--ink);font-weight:600;width:1%;padding-right:18px}
  .rbt td.ok{color:var(--go)}
  .rbt td.bad{color:var(--red)}
  .rb .warn{background:var(--metal);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:11px 14px;margin:12px 0 0}
  .msg{font-size:.85rem;color:var(--mute);min-height:18px;margin-top:8px}

  /* owner-only controls, hidden for a rep sign-in */
  .ownerOnly[hidden]{display:none!important}
  .whoami{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.1em;
    text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--metal);
    color:var(--mute2);border:1px solid var(--line)}
  .whoami.rep{color:var(--blue);border-color:var(--blue)}
  td.owner-c{color:var(--mute2);font-size:.8rem}
  td.owner-c.me{color:var(--go)}

  /* call script */
  .scriptbtn{background:var(--metal);color:var(--amber);border:1px solid var(--line);
    border-radius:7px;padding:5px 10px;font:inherit;font-size:.76rem;cursor:pointer;white-space:nowrap}
  .scriptbtn:hover{border-color:var(--amber)}
  .scriptbtn.cold{color:var(--mute2)}
  tr.suppressed-row{opacity:.68} tr.suppressed-row .name{color:var(--mute2)}
  .supbtn{margin-top:6px;white-space:nowrap}.sup-reason{display:block;color:var(--red);font-size:.7rem;margin-top:3px;max-width:230px}
  .modal{position:fixed;inset:0;background:rgba(4,4,6,.78);display:none;z-index:50;
    align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
  .modal.open{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    max-width:720px;width:100%;padding:22px 26px 26px}
  .sheet h2{font-family:"Archivo",sans-serif;font-size:1.15rem;margin-bottom:2px}
  .sheet .who{color:var(--mute2);font-size:.83rem;margin-bottom:16px}
  .sheet .warn{background:var(--metal);border-left:3px solid var(--red);border-radius:0 8px 8px 0;
    padding:11px 14px;margin-bottom:16px;color:var(--mute);font-size:.86rem}
  .sheet .warn.ok{border-left-color:var(--go)}
  .step{border-top:1px solid var(--line);padding:13px 0}
  .step:first-of-type{border-top:none}
  .step .n{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--amber);margin-bottom:6px}
  .step p{color:var(--ink);font-size:.95rem;line-height:1.6}
  .step p.say{border-left:2px solid var(--line);padding-left:13px}
  .sheet .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;
    border-top:1px solid var(--line);padding-top:16px}
  .sheet .foot .n{color:var(--mute2);font-size:.8rem}
</style>

<body class="sunflower-console">
<div class="wrap">
  <div id="login">
    <h1>Live Local Sites Admin</h1>
    <div class="sub">Enter your admin key.</div>
    <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" />
    <button class="btn" id="loginBtn" style="width:100%">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="app"></div>
</div>

<script src="/admin-poll.js"></script>
<script>
const $=id=>document.getElementById(id);
localStorage.removeItem('ks-admin-key');
let KEY='';
let LEADS=[], sortK='trade', sortDir=1;
let ROLE='owner', ME='operator';
const sel=new Set();
const STAGES=[['','— stage'],['called','Called'],['responded','Responded'],['won','Won'],['dead','Dead']];
const COST=0.94;

/* ---------------------------------------------------------------------------
   THE CALL SCRIPT.
   The runbook told the caller "every business with a demo already built has a
   live link in the call script", and there was no call script on this page and
   no demo link, so a rep arrived with a phone number and nothing to say. The
   scripts lived in _outreach/delivery-call-scripts.md, which .vercelignore keeps
   off the deployed site entirely.

   The shape below is the one from that file. The per-shop hooks and owner names
   are the verified ones from _outreach/kc-verified-strike-list.csv. Anything not
   in this map still gets the shape, but is clearly marked as a COLD call rather
   than a delivery, because the whole close depends on the site already existing.
   Add a shop here when you build its demo.
--------------------------------------------------------------------------- */
const DEMO_BASE='/demos/';
const CALLS={
  'auto tech services center':{who:'Kendall',demo:'auto-tech-shawnee',
    hook:"you've got the best reputation in Shawnee, 70-plus reviews, and when somebody Googles 'auto repair Shawnee' they can't find you, just a generic NAPA page",
    skeptic:"Don't take my word for it. Let me text it, you look at your own shop's site, then argue with me."},
  'autobots garage':{who:'Steve',demo:'autobots-overland-park',
    hook:"you've got a 4.9, that's near-perfect, almost nobody has that, and your whole website is a Facebook page. All that reputation and nowhere to send it",
    skeptic:"Fair. Let me text it, it's your shop, your 4.9, your services. Look, then decide."},
  "dave's trusted auto":{who:'Dave',demo:'daves-trusted-auto-grandview',
    hook:"you've got seventy-plus reviews at 4.6, that's a serious reputation, and there's no website to put it on, so when somebody new Googles you all that trust just isn't there to see",
    skeptic:"The name's literally Dave's Trusted. Let me text it and earn the word. Look first, then tell me no."},
  "charlie's brake & muffler":{who:'Charlie',demo:'charlies-brake-muffler-lenexa',
    hook:"you've been the brake-and-muffler shop in Lenexa for fifteen-plus years, great reviews, and there's no website at all, so somebody searching 'brakes near me' in Lenexa never lands on you",
    skeptic:"Fifteen years and no site to show for it. Let me text it, you look at your own shop, then argue."},
  'lee auto repair':{who:'Lee',demo:'lee-auto-repair-kansas-city',
    hook:"you've had a following on 31st Street for decades, sixty-plus reviews, and there's no website, so the younger customers who only search online never even find you",
    skeptic:"You've earned the reputation the hard way. Let me text you the site so it finally shows up online."},
  "amilcar's auto repair":{who:'Amilcar',demo:'amilcars-auto-repair-independence',
    hook:"you've been running honest work on US-24 for a long time, good reviews, and there's no website, so anybody who searches instead of asking a neighbour never finds you",
    skeptic:"No pressure at all. Let me text it, you look at your own shop's site, and if it's not better than nothing, delete it."},
  "b.n.s. (bored n' stroked) auto repair":{who:'Jace',
    hook:"you own a domain but it's sitting on a placeholder template with fake content on it, which makes a real business look fake to anyone who checks"},
  'nieman auto & tire repair':{who:'Geoffrey',
    hook:"you're an established tire-and-auto shop with warm reviews and no website at all"},
  'mobile mechanic kc':{
    hook:"you're competing with a dozen identically-named KC mobile mechanics and there's no site to tell you apart"},
  'dudes automotive':{
    hook:"seventy years of lineage being built on Facebook and TikTok with no site to anchor it"},
};
function callInfo(l){
  const k=String(l.name||'').toLowerCase().trim();
  return CALLS[k]||null;
}

async function api(action,extra){
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,token:KEY,...(extra||{})})});
  const d=await r.json().catch(()=>({}));
  return {status:r.status,ok:r.ok&&d.ok,d};
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function addr(r){return [r.street,r.city,r.state,r.zip].filter(Boolean).join(' ')}
function hasAddr(r){return !!(r.street&&r.state&&r.zip)}
function isMailed(r){return r.status==='mailed'||!!r.lob_id}
function isBad(r){return r.status==='bad_address'}
function isSuppressed(r){return !!r.suppressed}
function inQueue(r){return hasAddr(r)&&!isMailed(r)&&!isBad(r)&&!isSuppressed(r)}
function mailState(r){return isSuppressed(r)?'suppressed':isMailed(r)?'mailed':isBad(r)?'bad_address':hasAddr(r)?'queued':'noaddr'}

function showLogin(m){ $('app').style.display='none'; $('login').style.display='block'; $('loginErr').textContent=m||''; }

// A rep sign-in gets the call list and nothing that spends money or touches a
// customer. The server enforces this too (lib/roles.js); hiding the controls
// just stops anyone being invited to click something that will 403.
function applyRole(){
  const rep = ROLE==='rep';
  document.querySelectorAll('.ownerOnly').forEach(el=>{ el.hidden = rep; });
  const w=$('whoami'); w.hidden=false;
  w.textContent = rep ? ('Rep · '+ME) : 'Owner';
  w.className = 'whoami'+(rep?' rep':'');
  if(rep){
    $('pageTitle').textContent='Call list';
    $('pageSub').textContent='Work the list, open the script, log what happened. Postage and customer billing are not on this sign-in, on purpose.';
  }
}

async function boot(){
  if(!KEY){ showLogin(); return; }
  const res=await api('list');
  if(res.status===401){ showLogin('That key was not recognised.'); return; }
  if(res.status===503){ showLogin(res.d.message||'Store not configured yet.'); return; }
  if(!res.ok){ showLogin('Error: '+(res.d.error||res.status)); return; }
  // The app markup is served by the API only after the key validates.
  // Inject it before any element ids are wired or painted.
  if(!$('app').dataset.loaded){
    const shell=await api('shell');
    if(!shell.ok||!shell.d.app){ showLogin('Error: '+(shell.d.error||'panel unavailable')); return; }
    $('app').innerHTML=shell.d.app;
    $('app').dataset.loaded='1';
    wire();
  }
  LEADS=res.d.leads||[];
  ROLE=res.d.role||'owner'; ME=res.d.name||'';
  $('login').style.display='none'; $('app').style.display='block';

// ---- LASER funnel ----
// The engine (lib/laser.js) and the endpoint both already existed. Nothing
// rendered them, so the whole thing was invisible unless you POSTed by hand.
const STAGE_LABEL={lead:'Leads',appointment:'Appointments',show:'Showed',enrollment:'Enrolled',referral:'Referrals',dead:'Dead'};
const STAGE_ORDER=['lead','appointment','show','enrollment','referral'];
const TRANS_LABEL={
  'source>leads':'Finding them','leads>appointments':'Getting a meeting',
  'appointments>shows':'They turn up','shows>enrollments':'They buy',
  'enrollments>referrals':'They refer'
};
const fmoney=(c)=>'$'+((c||0)/100).toFixed((c||0)%100?2:0);

async function loadFunnel(){
  const el=$('laser'); if(!el) return;
  const res=await api('funnel');
  if(!res.ok){ el.hidden=true; return; }
  el.hidden=false;
  const d=res.d, by=d.byStage||{};

  // Stage counts, with the conversion INTO each stage shown on the join.
  $('stages').innerHTML=STAGE_ORDER.map(function(s,i){
    const prev=i>0?(by[STAGE_ORDER[i-1]]||0):0, n=by[s]||0;
    const conv=(i>0&&prev)?'<div class="conv">'+Math.round((n/prev)*100)+'%</div>':'';
    return '<div class="stg">'+conv+'<b>'+n+'</b><span>'+STAGE_LABEL[s]+'</span></div>';
  }).join('')+'<div class="stg dead"><b>'+(by.dead||0)+'</b><span>'+STAGE_LABEL.dead+'</span></div>';

  const rates=d.rates||{};
  const rateBits=Object.keys(rates).map(function(k){
    const r=rates[k];
    return '<span>'+esc(TRANS_LABEL[k]||k)+' <b>'+Math.round((r.rate||0)*100)+'%</b> '
      +'<span style="color:var(--mute2)">('+r.wins+'/'+r.trials+')</span></span>';
  });
  $('laserSub').innerHTML=['<span>Touches <b>'+(d.touches||0)+'</b></span>',
    '<span>Spent <b>'+fmoney(d.spendCents)+'</b></span>',
    '<span>Plays <b>'+(d.plays||0)+'</b></span>'].concat(rateBits).join('');

  // score is the Wilson lower bound; weight is the share of volume the
  // optimiser would send next, which is why a losing play keeps a trickle.
  const ranked=d.ranked||[], weights=d.weights||{};
  if(!ranked.length){
    $('playsWrap').innerHTML='<p class="laser-empty">No touches recorded yet. Every call, postcard and reply you log on the board feeds this, and it starts ranking as soon as there is something to compare.</p>';
    return;
  }
  const maxW=Math.max.apply(null,ranked.map(function(p){return weights[p.id]||0}).concat([0.0001]));
  $('playsWrap').innerHTML='<table class="plays"><thead><tr>'
    +'<th>What</th><th>How</th><th>Deal</th><th>Won</th><th>Rate</th><th>Confidence</th><th>Send next</th>'
    +'</tr></thead><tbody>'
    +ranked.map(function(p){
      const rate=p.trials?Math.round((p.wins/p.trials)*100):0, w=weights[p.id]||0;
      return '<tr>'
        +'<td class="k">'+esc(TRANS_LABEL[p.transitionId]||p.transitionId)+'</td>'
        +'<td><span class="chan">'+esc(p.unit||'none')+'</span></td>'
        +'<td>'+esc(p.dealSize||'')+'</td>'
        +'<td class="n">'+p.wins+'/'+p.trials+'</td>'
        +'<td class="n">'+rate+'%</td>'
        +'<td class="n">'+Math.round((p.score||0)*100)+'%</td>'
        +'<td><span class="wbar"><i><em style="width:'+Math.round((w/maxW)*100)+'%"></em></i>'
        +'<span>'+Math.round(w*100)+'%</span></span></td>'
        +'</tr>';
    }).join('')+'</tbody></table>';
}

function uniq(k){return [...new Set(LEADS.map(r=>r[k]).filter(Boolean))].sort()}

function ownerMatch(r){
  const v=$('fOwner').value;
  if(!v) return true;
  if(v==='__me') return (r.owner||'')===ME;
  if(v==='__none') return !r.owner;
  return true;
}
function demoMatch(r){
  const v=$('fDemo').value;
  if(!v) return true;
  const has=!!(callInfo(r)&&callInfo(r).demo);
  return v==='1' ? has : !has;

function filtered(){

    &&(!$('fTrade').value||r.trade===$('fTrade').value)
    &&(!$('fState').value||r.state===$('fState').value)
    &&(!$('fStatus').value||mailState(r)===$('fStatus').value)
    &&(!$('fStage').value||(r.stage||'')===$('fStage').value)
    &&ownerMatch(r)&&demoMatch(r))
    .sort((a,b)=>String(a[sortK==='address'?'city':sortK]||'').localeCompare(String(b[sortK==='address'?'city':sortK]||''))*sortDir);

    $('outreachMsg').textContent='Running K6 outreach...';
    const r=await api('run-outreach');
    if(r.ok){ $('outreachMsg').textContent='Run complete: '+(r.d.sent||0)+' sent.'+(r.d.run&&r.d.run.capStop?(' Stopped: '+r.d.run.capStop):''); }
    else { $('outreachMsg').textContent='Error: '+((r.d&&r.d.message)||(r.d&&r.d.error)||r.status); }
    await refresh();
  };
  $('readinessCheck').onclick=async()=>{
    $('readinessOut').textContent=' checking…';
    const r=await api('outreach-readiness');
    if(!r.ok){ $('readinessOut').textContent=' unavailable: '+((r.d&&r.d.message)||(r.d&&r.d.error)||r.status); return; }
    const d=r.d.readiness||{};
    const c=d.candidates||{};
    const fmt=(o)=>Object.keys(o||{}).sort().map(function(k){return esc(k)+': '+o[k]}).join(' · ')||'none';
    $('readinessOut').innerHTML='<br>'
      +'K6 '+(d.armed?'ARMED':'off')+' · provider '+esc(d.providerMode||'?')+' · reserve '+(d.postcardReserve&&d.postcardReserve.configured?d.postcardReserve.cents+'¢':'not set')
      +' · sender fields '+Object.keys(d.sender||{}).filter(function(k){return d.sender[k]}).length+'/5'
      +'<br>blockers: '+((OUTREACH.blockers&&OUTREACH.blockers.length)?OUTREACH.blockers.map(esc).join('; '):'none')
      +'<br>K4/K5 pipeline: candidates '+(c.total||0)+' · ranked '+(c.ranked||0)+' · drafted '+(c.drafted||0)+' · drafted mailable '+(c.draftedMailable||0)
      +'<br>send pool (what a run would consider): legacy queue '+(d.legacyQueue||0)+' + drafted '+(c.draftedMailable||0)+' → pool '+(d.pool||0)+' · mailable '+(d.mailable||0)+' · <b>eligible now '+(d.eligible||0)+'</b>'
      +'<br>ineligible: '+fmt(d.ineligibleReasons)
      +'<br>eligible by trade: '+fmt(d.eligibleByTrade)
      +'<br>eligible by city: '+fmt(d.eligibleByCity)
      +'<br>effects: '+fmt(d.effectsByStatus);
  };

  $('signout').onclick=()=>{ localStorage.removeItem('ks-admin-key'); KEY=''; showLogin(); };
  ['q','fTrade','fState','fStatus','fStage','fOwner','fDemo'].forEach(id=>$(id).oninput=render);
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sortDir=(k===sortK)?-sortDir:1;sortK=k;render();});
  $('tb').addEventListener('change',async e=>{
    if(e.target.classList.contains('rc')){ const id=e.target.dataset.id; e.target.checked?sel.add(id):sel.delete(id); updSel(); return; }
    if(e.target.dataset.stage){ const id=e.target.dataset.stage; const r=LEADS.find(x=>x.id===id);
      if(r){ r.stage=e.target.value;
        const res=await api('update',{id,stage:r.stage});
        // The server stamps whoever first moved a lead as its owner. Take that
        // back so the Owner column is the server's answer, not a local guess.
        if(res.ok&&res.d.meta&&res.d.meta.owner) r.owner=res.d.meta.owner;
        render(); } }
  });
  $('tb').addEventListener('blur',async e=>{
    if(e.target.dataset.note){ const id=e.target.dataset.note; const r=LEADS.find(x=>x.id===id);
      if(r&&r.notes!==e.target.value){ r.notes=e.target.value; await api('update',{id,notes:r.notes}); } }
  },true);
  $('chkAll').onchange=e=>{ filtered().forEach(r=>{ if(inQueue(r)){ e.target.checked?sel.add(r.id):sel.delete(r.id);} }); render(); };
  $('selAll').onclick=()=>{ filtered().forEach(r=>{ if(inQueue(r)) sel.add(r.id); }); render(); };
  $('selNone').onclick=()=>{ sel.clear(); render(); };
  $('mailBtn').onclick=async()=>{
    const ids=[...sel]; if(!ids.length) return;
    // The budget number shown is the owner-set K6 reserve per card when known —
    // the same value the spend caps count — never a guessed provider price.
    const reserveCents=(OUTREACH.config&&+OUTREACH.config.postcardReserveCents)||Math.round(COST*100);
    const cost=(ids.length*reserveCents/100).toFixed(2);
    if(!confirm(`Send ${ids.length} postcard(s) via Lob through the K6 control plane (budget reserve about $${cost})? Ineligible or undeliverable ones are skipped automatically.`)) return;
    $('mailBtn').disabled=true; $('msg').textContent='Sending '+ids.length+'...';
    const res=await api('mail',{ids});
    if(res.ok){
      const r2=await api('list'); if(r2.ok) LEADS=r2.d.leads;
      sel.clear();
      const run=res.d.run||{};
      $('msg').textContent=`Done: ${res.d.sent||0} mailed, ${run.skipped||0} skipped, ${run.dead||0} dead`+(run.capStop?`, stopped: ${run.capStop}`:'')+'.';
      render();
    } else { $('msg').textContent='Error: '+(res.d.message||res.d.error||res.status); $('mailBtn').disabled=false; }
  };

  $('tb').addEventListener('click',e=>{ const id=e.target.dataset&&e.target.dataset.script; if(id) openScript(id); });
  $('tb').addEventListener('click',async e=>{
    const sid=e.target.dataset&&e.target.dataset.suppress;
    const uid=e.target.dataset&&e.target.dataset.unsuppress;
    if(sid){
      const lead=LEADS.find(x=>x.id===sid); if(!lead) return;
      const reason=prompt('Why should every outreach channel stop for '+lead.name+'?','Customer asked not to be contacted.');
      if(reason===null) return;
      const res=await api('suppress',{id:sid,reason:reason||'Do not contact',channel:'manual'});
      if(!res.ok){ $('msg').textContent='Could not suppress: '+(res.d.message||res.d.error||res.status); return; }
      await refresh(); $('msg').textContent=lead.name+' is now blocked across postcards, calls, texts, and email drafts.';
    }
    if(uid){
      const lead=LEADS.find(x=>x.id===uid); if(!lead) return;
      if(!confirm('Lift the do-not-contact block for '+lead.name+'? This makes outreach controls available again.')) return;
      const res=await api('unsuppress',{id:uid,suppressionId:lead.suppressionId});
      if(!res.ok){ $('msg').textContent='Could not lift suppression: '+(res.d.error||res.status); return; }
      await refresh(); $('msg').textContent='Suppression lifted. The lead stays at its current funnel stage until you deliberately reopen it.';
    }
  });
  $('scClose').onclick=closeScript;
  $('scriptModal').addEventListener('click',e=>{ if(e.target===$('scriptModal')) closeScript(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeScript(); });
  $('scCopyText').onclick=async()=>{
    if(!scText) return;
    try{ await navigator.clipboard.writeText(scText); $('scNote').textContent='Copied. Paste it into a text message.'; }
    catch(err){ $('scNote').textContent='Could not copy automatically. Select the link above and send it.'; }
  };
  $('scPublish').onclick=async()=>{
    if(!scLead) return;
    $('scPublish').disabled=true; $('scNote').textContent='Publishing...';
    const res=await api('site-publish',{id:scLead.id});
    if(!res.ok){ $('scNote').textContent='Could not publish: '+(res.d.message||res.d.error||res.status); $('scPublish').disabled=false; return; }
    scLead.sitePublished=true; scLead.siteSlug=res.d.slug;
    $('scNote').textContent='Live at '+location.origin+res.d.url+'. Now copy the text.';
    openScript(scLead.id);   // repaint: the warning and the copy button both change
    $('scNote').textContent='Live now. Copy the text and send it.';
    render();
  };
  $('scCalled').onclick=async()=>{
    if(!scLead) return;
    scLead.stage='called';
    const res=await api('update',{id:scLead.id,stage:'called'});
    if(res.ok&&res.d.meta&&res.d.meta.owner) scLead.owner=res.d.meta.owner;
    $('scNote').textContent='Marked called'+(scLead.owner?(', owned by '+scLead.owner):'')+'.';
    render();
  };

  document.addEventListener('visibilitychange',function(){
    poller.handleVisibilityChange();
    if(!poller.running) $('liveLabel').textContent='Paused — tab hidden';
  });
}

$('loginBtn').onclick=async()=>{ KEY=$('key').value.trim(); boot(); };
$('key').onkeydown=e=>{ if(e.key==='Enter') $('loginBtn').click(); };
// autopilot controls — RETIRED with the legacy panel. The old switch/cap/
// ceiling inputs and the "Run a batch now" button no longer exist; the K6
// outreach panel above carries every send control, and the server refuses
// writes to the legacy config.

/* ---- the call script ---- */
let scLead=null, scText='';
function stepHtml(n,label,body,say){
  return `<div class="step"><div class="n">${n} · ${esc(label)}</div><p class="${say?'say':''}">${body}</p></div>`;
}
function openScript(id){
  const r=LEADS.find(x=>x.id===id); if(!r) return;
  if(isSuppressed(r)){ $('msg').textContent='Do not contact '+r.name+'. The shared suppression list has disabled this script.'; return; }
  scLead=r;
  const ci=callInfo(r);
  const contact=(ci&&ci.who)||'the owner';
  const where=[r.city,r.state].filter(Boolean).join(' ');
  const trade=(r.trade||'shop').toLowerCase();
  // Three ways a site can exist for this shop: a bulk-generated draft waiting to
  // be published, an already published one, or one of the six hand-built demos.
  const siteUrl = r.siteSlug ? (location.origin+'/s/'+r.siteSlug)
    : ((ci&&ci.demo) ? (location.origin+DEMO_BASE+ci.demo) : '');
  const needsPublish = !!(r.siteSlug && !r.sitePublished);

  $('scTitle').textContent=r.name||'This shop';
  $('scWho').textContent=[trade,where,r.phone].filter(Boolean).join(' · ');

  // The close depends on the site ALREADY EXISTING. If it does not, saying step
  // three is a lie, so say that here rather than let someone read it off a card.
  const w=$('scWarn');
  if(needsPublish){
    w.className='warn ok';
    w.innerHTML='A site is <b>built and waiting</b> for this shop. It is not visible to anyone yet, so do not send the link until they say yes. When they do, hit <b>Publish their site</b> below and the link goes live instantly: <b>'+esc(siteUrl)+'</b>';
  } else if(siteUrl){
    w.className='warn ok';
    w.innerHTML='Their site is <b>live right now</b>, so this is a <b>delivery, not a pitch</b>. Open it on your phone before you dial and check it loads: <a href="'+esc(siteUrl)+'" target="_blank" rel="noopener">'+esc(siteUrl)+'</a>';
  } else {
    w.className='warn';
    w.innerHTML='<b>No site has been built for this shop yet.</b> Step 3 below is not true for them, so do not say it. Treat this as a cold call and offer to build one.';
  }
  $('scPublish').hidden=!needsPublish;
  $('scPublish').disabled=false;

  const hook=(ci&&ci.hook)||('you\'re a '+trade+(where?(' in '+where):'')+' and there\'s no real website for people to find');
  const deliver=siteUrl
    ? 'So I already built you a real website. It\'s yours, free, you own it, no contract.'
    : 'So here\'s my offer: I\'ll build you a real website, free, yours to keep, no contract.';

  $('scSteps').innerHTML=[
    stepHtml(1,'Disarm',`"Hi, is this ${esc(contact)}? My name's ${esc(ME==='operator'?'Chris':ME)}, I run a shop called Live Local Sites. I'll be straight with you, this is a sales call, you can hang up and I won't take it personally. Thirty seconds?"`,true),
    stepHtml(2,'Their hook, the one true thing',`"Here's why I called <i>you</i>: ${esc(hook)}."`,true),
    stepHtml(3,'Deliver',`"${esc(deliver)}"`,true),
    stepHtml(4,'The catch, before they ask',`"The catch, before you ask: the add-ons are nineteen to twenty-nine bucks a month each, optional, off unless you flip them on. If you never do, you keep a free site and I lose the bet."`,true),
    stepHtml(5,'Zero-risk close',`"Can I text you the link right now?"`,true),
    ci&&ci.skeptic?stepHtml('IF','they push back',`"${esc(ci.skeptic)}"`,true):'',
    stepHtml('AFTER','yes, text it', needsPublish
      ? 'Hit <b>Publish their site</b> below FIRST, then copy the text and send it while you are still on the phone.'
      : (siteUrl ? 'Send it while you are still on the phone. Use the copy button below, then set the stage.'
                 : 'Take their number and get the site built before you promise a link.'),false),
  ].join('');

  scText=siteUrl
    ? `${r.name} - here's the site I built you, yours free: ${siteUrl}\nEverything on it is editable and it's yours to keep. The only things that ever cost anything are Google and online booking, $19/mo each, and they're off unless you say so. - Live Local Sites`
    : '';
  // Never hand out a link to a page that is still a 404.
  $('scCopyText').disabled=!scText||needsPublish;
  $('scNote').textContent='';
  $('scriptModal').classList.add('open');
}
function closeScript(){ $('scriptModal').classList.remove('open'); scLead=null; }
// Live refresh — tiered and visibility-aware (schedule lives in admin-poll.js,
// which test/admin-polling.mjs simulates). The old 20-second refresh loop
// fanned out to ten /api/admin calls per tick — ~1,800 requests/hour for one
// open owner tab — and burned the Upstash command budget from the inside.
async function refreshBoard(){
  if(!KEY||$('app').style.display==='none') return;
  const a=document.activeElement;
  if(a&&(a.classList.contains('note')||a.classList.contains('stage'))) return;
  const res=await api('list');
  if(res.ok){ LEADS=res.d.leads||[]; render();
    const t=new Date(); $('liveLabel').textContent='Live · updated '+t.toLocaleTimeString(); }
}
async function refreshStatus(){
  if(!KEY||$('app').style.display==='none') return;
  if(ROLE==='owner') loadLegacy();
  loadFunnel();
  loadDisc(); loadDraft();
  if(ROLE==='owner') loadOutreach();
}
async function refreshDetail(){
  if(ROLE!=='owner') return;
  loadOutreachDetail();
}
const poller=new AdminPoll.AdminPoller({
  onLight:refreshBoard, onStatus:refreshStatus, onDetail:refreshDetail,
  isVisible:function(){ return document.visibilityState==='visible'; },
});
// Mutations refresh everything once, through the poller's in-flight dedupe.
async function refresh(){ return poller.refreshAll(); }

boot();
</script>
</body>
</html>
