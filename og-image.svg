<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Archivo, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="80%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1BA45A" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#1BA45A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#121214"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- hazard stripe -->
  <rect x="0" y="0" width="1200" height="14" fill="#161616"/>
  <g>
    <rect x="0" y="0" width="1200" height="14" fill="#FFC42E" opacity="0.85" mask="url(#h)"/>
  </g>
  <defs>
    <pattern id="hz" width="64" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="32" height="14" fill="#FFC42E"/>
      <rect x="32" width="32" height="14" fill="#161616"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="14" fill="url(#hz)" opacity="0.85"/>

  <!-- brand lockup -->
  <g transform="translate(90, 96)">
    <g fill="none" stroke="#FF3826" stroke-width="11" stroke-linecap="round" transform="scale(0.46)">
      <path d="M62.5 30.4 A25 25 0 1 1 37.5 30.4"/>
      <path d="M50 22 V52"/>
    </g>
    <text x="70" y="38" fill="#FFFFFF" font-size="34" font-weight="900" letter-spacing="3">KILLSWITCH</text>
  </g>

  <!-- headline -->
  <text x="90" y="300" fill="#FFFFFF" font-size="104" font-weight="900" letter-spacing="-2">Your website.</text>
  <text x="90" y="410" fill="#FFC42E" font-size="104" font-weight="900" letter-spacing="-2">Free.</text>
  <text x="392" y="410" fill="#FFFFFF" font-size="104" font-weight="900" letter-spacing="-2">You own it.</text>

  <!-- subline -->
  <text x="92" y="486" fill="#b6bac2" font-size="34" font-weight="500">A real site on your own domain, built by a real human.</text>
  <text x="92" y="530" fill="#b6bac2" font-size="34" font-weight="500">Turn on booking, payments, and a 24/7 AI only when you need them.</text>

  <!-- footer tag -->
  <text x="90" y="596" fill="#888c96" font-size="26" font-weight="600" letter-spacing="2">SERVING ALL 50 STATES  ·  KILLSWITCH.DOMAINS</text>
</svg>
